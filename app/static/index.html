<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLB Sample Tag Generator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">MLB SAMPLE TAG GENERATOR</div>
    <div class="top-actions"><button id="adminToggle" class="ghost">RAW DATA MANAGEMENT</button></div>
  </header>

  <main class="dashboard">
    <section class="data-strip no-print">
      <div class="field-block compact"><label>SEASON</label><select id="seasonSelect"></select></div>
      <div class="data-status" id="dataStatus">Select a season to load RAW DATA.</div>
    </section>

    <section id="adminPanel" class="admin-panel hidden no-print">
      <div class="admin-title">RAW DATA MANAGEMENT</div>
      <div class="admin-grid">
        <div class="field-block"><label>SEASON</label><input id="adminSeason" placeholder="e.g. 27SS" maxlength="4" /></div>
        <div class="field-block"><label>ADMIN PASSWORD</label><input id="adminToken" type="password" autocomplete="current-password" /></div>
        <div class="field-block file-field"><label>RAW DATA FILE (.XLSX)</label><input id="rawDataFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" /></div>
        <button id="uploadBtn" class="primary upload-btn">UPLOAD / REPLACE</button>
      </div>
      <div id="uploadStatus" class="upload-status"></div>
    </section>

    <section class="workspace">
      <div class="editor-card no-print">
        <div class="section-title">SAMPLE TAG LAYOUT EDIT</div>
        <div class="search-grid">
          <div class="field-block grow"><label>STYLE NO.</label><input id="styleSearch" list="styleList" placeholder="Enter STYLE NO." autocomplete="off" /><datalist id="styleList"></datalist></div>
          <button id="loadBtn" class="primary search-btn">SEARCH</button>
        </div>
        <div class="edit-form">
          <div class="edit-row"><label>STYLE / SAMPLE #</label><input data-field="style_sample_no" /></div>
          <div class="edit-row"><label>SIZE</label><input data-field="size" /></div>
          <div class="edit-row"><label>DESCRIPTION</label><input data-field="description" /></div>
          <div class="edit-row"><label>VENDOR</label><input data-field="vendor" /></div>
          <div class="edit-row"><label>FACTORY</label><input data-field="factory" /></div>
          <div class="edit-row tall"><label>FABRIC / CONTENT / WEIGHT</label><textarea data-field="fabric_info" rows="2"></textarea></div>
          <div class="edit-row"><label>WASHING / FINISHING</label><input data-field="washing_finishing" /></div>
          <div class="edit-row"><label>E-PATTERN</label><div class="inline-options"><label><input type="radio" name="epattern" value="YES" checked /> YES</label><label><input type="radio" name="epattern" value="NO" /> NO</label></div></div>
          <div class="edit-row"><label>SHIP DATE</label><input data-field="ship_date" type="date" /></div>
          <div class="edit-row"><label>REFERENCE ONLY</label><input type="checkbox" data-field="reference_only" class="edit-check" /></div>
          <div class="edit-row"><label>TOP SAMPLE</label><input type="checkbox" data-field="top_sample" class="edit-check" /></div>
          <div class="edit-row"><label>SHIP SAMPLE</label><input type="checkbox" data-field="ship_sample" class="edit-check" /></div>
          <div class="edit-row"><label>RECEIVING DATE</label><input data-field="receiving_date" type="text" value="" /></div>
          <div class="edit-row"><label>FITTING DATE</label><input data-field="fitting_date" type="text" value="" /></div>
          <div class="edit-row"><label>DESIGNER</label><input data-field="designer" /></div>
          <div class="edit-row"><label>TD</label><input data-field="td" /></div>
          <div class="edit-row"><label>CNFM DATE</label><input data-field="confirm_date" type="text" value="" /></div>
          <div class="edit-row"><label>STATUS</label><input data-field="status" /></div>
        </div>
      </div>

      <div class="preview-column">
        <section class="preview-card">
          <div class="section-title">PREVIEW <span>50 mm × 90 mm</span></div>
          <div class="preview-stage">
            <article id="sampleTag" class="sample-tag">
              <div class="tag-row"><label>Style/Sample #</label><input class="fit-one" data-field="style_sample_no" /></div>
              <div class="tag-row"><label>Size</label><input class="fit-one" data-field="size" /></div>
              <div class="tag-row"><label>Description</label><input class="fit-one" data-field="description" /></div>
              <div class="tag-row"><label>Vendor</label><input class="fit-one" data-field="vendor" /></div>
              <div class="tag-row"><label>Factory</label><input class="fit-one" data-field="factory" /></div>
              <div class="tag-row fabric-row"><label>Fabric/Content/Weight</label><textarea class="fit-two" data-field="fabric_info" rows="2"></textarea></div>
              <div class="tag-row"><label>Washing/Finishing</label><input class="fit-one" data-field="washing_finishing" /></div>
              <div class="tag-row epattern-row"><label>E-Pattern 전달</label><div class="epattern-value"><span id="epatternText">YES</span></div></div>
              <div class="tag-row"><label>Ship Date</label><input class="fit-one" data-field="ship_date" type="date" /></div>
              <div class="tag-spacer"></div>
              <div class="lower-grid">
                <div class="sample-box">
                  <div class="sample-title">Sample</div>
                  <label><span>Reference Only</span><input type="checkbox" data-field="reference_only" /></label>
                  <label><span>TOP</span><input type="checkbox" data-field="top_sample" /></label>
                  <label><span>Ship (수납)</span><input type="checkbox" data-field="ship_sample" /></label>
                </div>
                <div class="meta-box">
                  <div class="meta-row"><label>Receiving Date</label><input class="fit-one" data-field="receiving_date" type="text" value="" /></div>
                  <div class="meta-row"><label>Fitting Date</label><input class="fit-one" data-field="fitting_date" type="text" value="" /></div>
                  <div class="meta-row"><label>Designer</label><input class="fit-one" data-field="designer" /></div>
                  <div class="meta-row"><label>TD</label><input class="fit-one" data-field="td" /></div>
                  <div class="meta-row"><label>Cnfm Date</label><input class="fit-one" data-field="confirm_date" type="text" value="" /></div>
                </div>
              </div>
              <div class="bottom-spacer"></div>
              <div class="status-row"><label>Status</label><input class="fit-one" data-field="status" /></div>
            </article>
          </div>
        </section>

        <section class="print-card no-print">
          <div class="section-title">PRINT OPTIONS</div>
          <label class="print-option"><input type="radio" name="printMode" value="label" checked /><span><b>LABEL STICKER 50 × 90 mm</b><small>Print one tag at actual size</small></span></label>
          <label class="print-option"><input type="radio" name="printMode" value="a4" /><span><b>A4 — 6 TAGS</b><small>2 columns × 3 rows</small></span></label>
          <button id="printBtn" class="primary print-btn">PRINT</button>
        </section>
      </div>
    </section>

    <section id="a4PrintArea" class="a4-print-area" aria-hidden="true"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
